[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent"
version = "0.2.0"
description = "Production-grade AI Agent framework based on LangGraph ReAct pattern"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Agent Team" },
]
keywords = ["ai", "agent", "langchain", "langgraph", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langgraph>=0.1.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# LLM Providers
openai = ["langchain-openai>=0.1.0"]
anthropic = ["langchain-anthropic>=0.1.0"]
all-llms = ["langchain-openai>=0.1.0", "langchain-anthropic>=0.1.0"]

# Storage Backends
redis = ["redis>=5.0.0"]

# API Server
api = ["fastapi>=0.100.0", "uvicorn[standard]>=0.20.0"]

# Authentication
auth = ["pyjwt>=2.0.0"]

# Token Counting
tiktoken = ["tiktoken>=0.5.0"]

# All optional
all = [
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "redis>=5.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pyjwt>=2.0.0",
    "tiktoken>=0.5.0",
]

# Development
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
agent-server = "agent.api:run_server"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
