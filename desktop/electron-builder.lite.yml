appId: com.agent.desktop
productName: Agent Desktop
copyright: Copyright © 2024 Agent Team

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - "!node_modules"

# 精简版：不捆绑 Python，用户需自行安装 Python 3.10+
# 仅包含前端和 Electron 壳

# Windows 配置
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: "${productName}-${version}-lite-setup.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  shortcutName: Agent Desktop

# macOS 配置
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/icon.icns
  category: public.app-category.developer-tools
  artifactName: "${productName}-${version}-lite.${ext}"

dmg:
  contents:
    - x: 410
      y: 150
      type: link
      path: /Applications
    - x: 130
      y: 150
      type: file

# Linux 配置
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build/icons
  category: Development
  artifactName: "${productName}-${version}-lite.${ext}"
