appId: com.agent.desktop
productName: Agent Desktop
copyright: Copyright © 2024 Agent Team

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - "!node_modules"

# 捆绑 Python Agent (完整版)
extraResources:
  - from: "../agent"
    to: "agent"
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/.git/**"
      - "!**/tests/**"
  - from: "python-embedded"
    to: "python"
    filter:
      - "**/*"

# Windows 配置
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: "${productName}-${version}-full-setup.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  shortcutName: Agent Desktop

# macOS 配置
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/icon.icns
  category: public.app-category.developer-tools
  artifactName: "${productName}-${version}-full.${ext}"

dmg:
  contents:
    - x: 410
      y: 150
      type: link
      path: /Applications
    - x: 130
      y: 150
      type: file

# Linux 配置
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build/icons
  category: Development
  artifactName: "${productName}-${version}-full.${ext}"
